# Midified from https://github.com/BernardoCama/BernardoCama.github.io/blob/main/bin/fetch_scholar_citations.py

name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run citation update script
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python bin/update_scholar_citations.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update citations [CI]"
          file_pattern: _data/citations.yml
          token: ${{ secrets.PAT }}
